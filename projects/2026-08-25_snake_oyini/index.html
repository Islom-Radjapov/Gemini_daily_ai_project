<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        /* Global styles for the body */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #2c3e50; /* Dark blue-gray background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ecf0f1; /* Light gray text */
            user-select: none; /* Prevent text selection */
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE/Edge */
        }

        /* Styling for the game container */
        .game-container {
            background-color: #34495e; /* Slightly lighter blue-gray */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* Styling for the canvas element */
        canvas {
            background-color: #1a252f; /* Dark background for game area */
            border: 5px solid #3498db; /* Blue border */
            display: block; /* Remove extra space below canvas */
            margin: 20px auto; /* Center the canvas */
        }

        /* Styling for score display */
        .score-display {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: bold;
        }

        /* Styling for game over message */
        .game-over-message {
            margin-top: 15px;
            font-size: 1.5em;
            color: #e74c3c; /* Red for game over */
            font-weight: bold;
            display: none; /* Hidden by default */
        }

        /* Styling for restart button */
        .restart-button {
            background-color: #2ecc71; /* Green button */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 10px;
            transition: background-color 0.2s ease-in-out;
            display: none; /* Hidden by default */
        }

        .restart-button:hover {
            background-color: #27ae60; /* Darker green on hover */
        }

        h1 {
            color: #f1c40f; /* Yellow title */
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Snake Game</h1>
        <div class="score-display">
            <span>Score: <span id="current-score">0</span></span>
            <span>High Score: <span id="high-score">0</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="gameOverMessage" class="game-over-message">
            Game Over!
        </div>
        <button id="restartButton" class="restart-button">Play Again</button>
    </div>

    <script>
        // Get canvas and its 2D rendering context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Get score and high score display elements
        const currentScoreDisplay = document.getElementById('current-score');
        const highScoreDisplay = document.getElementById('high-score');
        const gameOverMessage = document.getElementById('gameOverMessage');
        const restartButton = document.getElementById('restartButton');

        // Game constants
        const gridSize = 20; // Size of each tile in pixels
        const tileCount = canvas.width / gridSize; // Number of tiles across the canvas

        // Game state variables
        let snake = [];
        let food = {};
        let dx = 0; // Horizontal direction (1 for right, -1 for left)
        let dy = 0; // Vertical direction (1 for down, -1 for up)
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0; // Load high score from local storage
        let gameOver = false;
        let gameInterval;
        let gameSpeed = 150; // Milliseconds between game updates (lower = faster)
        let changingDirection = false; // Flag to prevent rapid direction changes

        /**
         * Initializes or resets the game state.
         */
        function initGame() {
            // Reset game variables
            snake = [
                { x: 10, y: 10 }, // Initial head position
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1; // Initial direction: right
            dy = 0;
            score = 0;
            gameOver = false;
            changingDirection = false;

            // Update score displays
            currentScoreDisplay.textContent = score;
            highScoreDisplay.textContent = highScore;

            // Hide game over message and restart button
            gameOverMessage.style.display = 'none';
            restartButton.style.display = 'none';

            placeFood(); // Place food on the canvas
            startGameLoop(); // Start the game loop
        }

        /**
         * Starts the game loop using setInterval.
         */
        function startGameLoop() {
            // Clear any existing interval to prevent multiple game loops
            if (gameInterval) {
                clearInterval(gameInterval);
            }
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        /**
         * The main game loop function.
         * Updates game state and redraws elements.
         */
        function gameLoop() {
            if (gameOver) {
                return; // Stop updating if game is over
            }

            changingDirection = false; // Allow direction changes for next frame
            update(); // Update snake position, check collisions, etc.
            draw(); // Redraw game elements
        }

        /**
         * Updates the game state for each frame.
         */
        function update() {
            // Calculate the new head position
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check for collisions
            if (checkCollision(head)) {
                endGame();
                return;
            }

            // Add the new head to the snake's body
            snake.unshift(head);

            // Check if snake ate the food
            if (head.x === food.x && head.y === food.y) {
                score++;
                currentScoreDisplay.textContent = score;
                placeFood(); // Place new food
                // Optionally increase speed
                // gameSpeed = Math.max(50, gameSpeed - 5); // Minimum speed of 50ms
                // startGameLoop(); // Restart interval with new speed
            } else {
                // If no food eaten, remove the tail segment
                snake.pop();
            }
        }

        /**
         * Draws all game elements on the canvas.
         */
        function draw() {
            // Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw snake segments
            snake.forEach(drawSnakeSegment);

            // Draw food
            drawFood();
        }

        /**
         * Draws a single snake segment.
         * @param {object} segment - The x, y coordinates of the segment.
         */
        function drawSnakeSegment(segment) {
            ctx.fillStyle = '#2ecc71'; // Green color for snake
            ctx.strokeStyle = '#27ae60'; // Darker green border
            ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
        }

        /**
         * Draws the food item.
         */
        function drawFood() {
            ctx.fillStyle = '#e74c3c'; // Red color for food
            ctx.strokeStyle = '#c0392b'; // Darker red border
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        /**
         * Places food at a random valid location on the canvas.
         */
        function placeFood() {
            let newFoodX, newFoodY;
            let collisionWithSnake;

            do {
                newFoodX = Math.floor(Math.random() * tileCount);
                newFoodY = Math.floor(Math.random() * tileCount);

                // Check if new food position collides with any part of the snake
                collisionWithSnake = snake.some(segment => segment.x === newFoodX && segment.y === newFoodY);

            } while (collisionWithSnake); // Keep trying until food is not on the snake

            food = { x: newFoodX, y: newFoodY };
        }

        /**
         * Checks for collisions (wall or self).
         * @param {object} head - The potential new head position of the snake.
         * @returns {boolean} True if a collision occurred, false otherwise.
         */
        function checkCollision(head) {
            // Wall collision
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= tileCount;
            const hitTopWall = head.y < 0;
            const hitBottomWall = head.y >= tileCount;

            if (hitLeftWall || hitRightWall || hitTopWall || hitBottomWall) {
                return true;
            }

            // Self-collision (start checking from the 4th segment to avoid immediate collision with neck)
            for (let i = 4; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }

            return false;
        }

        /**
         * Ends the game, updates high score, and displays game over message.
         */
        function endGame() {
            gameOver = true;
            clearInterval(gameInterval); // Stop the game loop

            // Update high score if current score is higher
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore); // Save to local storage
                highScoreDisplay.textContent = highScore;
            }

            // Show game over message and restart button
            gameOverMessage.style.display = 'block';
            restartButton.style.display = 'block';
        }

        /**
         * Handles keyboard input to change snake direction.
         * @param {Event} event - The keyboard event.
         */
        function changeDirection(event) {
            if (changingDirection) return; // Prevent multiple direction changes per frame

            const keyPressed = event.key;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingLeft = dx === -1;
            const goingRight = dx === 1;

            if (keyPressed === 'ArrowLeft' && !goingRight) {
                dx = -1;
                dy = 0;
                changingDirection = true;
            } else if (keyPressed === 'ArrowUp' && !goingDown) {
                dx = 0;
                dy = -1;
                changingDirection = true;
            } else if (keyPressed === 'ArrowRight' && !goingLeft) {
                dx = 1;
                dy = 0;
                changingDirection = true;
            } else if (keyPressed === 'ArrowDown' && !goingUp) {
                dx = 0;
                dy = 1;
                changingDirection = true;
            }
        }

        // Event listener for keyboard input
        document.addEventListener('keydown', changeDirection);

        // Event listener for restart button
        restartButton.addEventListener('click', initGame);

        // Initialize the game when the page loads
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
